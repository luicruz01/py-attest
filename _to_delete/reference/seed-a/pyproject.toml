[project]
name = "student-progress"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "ERA", "ARG", "T20"]

[tool.ruff.lint.per-file-ignores]
# Protected seed lines exceed 100 characters and cannot be reformatted in WP1a.
"app/main.py" = ["E501"]
"app/store.py" = ["E501"]
# Assertions and long test descriptions are accepted throughout the pytest tree.
"tests/**/*.py" = ["S101", "E501"]

[tool.ruff.format]
# These protected seed files predate Ruff formatting and cannot be changed in WP1a.
exclude = ["app/main.py", "app/models.py", "app/store.py", "tests/test_progress.py"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
