name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to review against main
        required: true
        type: string
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Ruff checks
        id: ruff
        run: |
          set +e
          ruff check . 2>&1 | tee "$RUNNER_TEMP/ruff-check.txt"
          check_exit=${PIPESTATUS[0]}
          ruff format --check . 2>&1 | tee "$RUNNER_TEMP/ruff-format.txt"
          format_exit=${PIPESTATUS[0]}
          set -e

          echo "check_exit=$check_exit" >> "$GITHUB_OUTPUT"
          echo "format_exit=$format_exit" >> "$GITHUB_OUTPUT"
      - name: Publish Ruff findings
        if: ${{ github.event_name == 'pull_request' && always() }}
        env:
          CHECK_EXIT: ${{ steps.ruff.outputs.check_exit }}
          FORMAT_EXIT: ${{ steps.ruff.outputs.format_exit }}
        run: |
          {
            echo "## Ruff lint (advisory)"
            echo
            echo "- \`ruff check\` exit code: \`${CHECK_EXIT}\`"
            echo "- \`ruff format --check\` exit code: \`${FORMAT_EXIT}\`"
            echo
            echo "### ruff check"
            echo '```text'
            cat "$RUNNER_TEMP/ruff-check.txt"
            echo '```'
            echo
            echo "### ruff format --check"
            echo '```text'
            cat "$RUNNER_TEMP/ruff-format.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce Ruff results
        if: >-
          github.event_name != 'pull_request' &&
          (steps.ruff.outputs.check_exit != '0' || steps.ruff.outputs.format_exit != '0')
        run: exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --cov=app --cov-report=term-missing

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit pinned dependencies (warning only)
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  ai-review:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.head_ref || inputs.branch }}
      cancel-in-progress: true
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod +x "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run AI reviewer
        id: review
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DESCRIPTION: |
            ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}
          DISPATCH_BRANCH: ${{ inputs.branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
            reviewer=(python tools/quality_gate/review.py \
              --base "origin/${PR_BASE_REF}" --branch "$PR_HEAD_SHA" \
              --description "$PR_DESCRIPTION" --out reports/)
          else
            git fetch origin "refs/heads/${DISPATCH_BRANCH}:refs/remotes/origin/${DISPATCH_BRANCH}"
            reviewer=(python tools/quality_gate/review.py \
              --base origin/main --branch "origin/${DISPATCH_BRANCH}" --out reports/)
          fi

          set +e
          if [[ -z "$OPENAI_API_KEY" ]]; then
            "${reviewer[@]}" --secrets-only
            reviewer_exit=$?
            if [[ $reviewer_exit -eq 0 ]]; then
              mkdir -p reports
              printf '%s\n' \
                '{' \
                '  "status": "skipped",' \
                '  "verdict": null,' \
                '  "findings": [],' \
                '  "filtered_out": [],' \
                '  "summary": "AI review skipped because OPENAI_API_KEY is unavailable for this run."' \
                '}' > reports/ai-review-skipped.json
              printf '%s\n' \
                '# AI Quality Review' \
                '' \
                '> **SKIPPED — OPENAI_API_KEY is unavailable for this run.**' \
                '' \
                'No LLM request was made. This is expected for pull requests from forks.' \
                > reports/ai-review-skipped.md
              echo "::notice::AI review skipped: OPENAI_API_KEY is unavailable; no LLM request was made."
            fi
          else
            "${reviewer[@]}"
            reviewer_exit=$?
          fi
          set -e

          echo "exit_code=$reviewer_exit" >> "$GITHUB_OUTPUT"
      - name: Comment on pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report_path="$(find reports -maxdepth 1 -name '*.md' -print -quit 2>/dev/null || true)"
          if [[ -n "$report_path" ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$report_path"
          else
            echo "::warning::The reviewer did not produce a Markdown report to comment."
          fi
      - name: Note fork pull request limitation
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork pull request: the read-only GITHUB_TOKEN cannot post the neutral report as a comment." \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload AI review reports
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/*.json
            reports/*.md
          if-no-files-found: warn
      - name: Propagate reviewer verdict
        env:
          REVIEWER_EXIT: ${{ steps.review.outputs.exit_code }}
        run: exit "$REVIEWER_EXIT"
