name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      # py_attest/review/secrets_gate.py and py_attest/check/runner.py shell out to
      # gitleaks; most of the review/check test suite needs the real binary on PATH
      # (only a few tests skip when it's absent). NOT pinned to .pre-commit-config.yaml's
      # rev (v8.21.2): verified empirically that v8.21.2 has a real bug where `gitleaks
      # stdin --report-path -` (our exact invocation) detects a leak (exit 1) but writes
      # nothing to stdout when stdin is a pipe rather than a TTY -- silently defeating
      # the firewall with no error. v8.30.1 does not have this bug (confirmed against
      # the same repro). Checksum verified against the published
      # gitleaks_8.30.1_checksums.txt for this asset.
      - name: Install gitleaks
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run tests
        run: uv run pytest -q
